[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["start_dev.sh", "start_dev.py"]

[tool.hatch.build.hooks.custom]

[project]
name = "merlin"
version = "0.7.0-beta"
authors = [
  { name="Aaron Langham", email="alangham@mit.edu" },
]
description = "Platform for high- and low-dimensional NILM data visualization"
requires-python = ">=3.9"
dependencies = ["joule", "fastapi", "matplotlib", "numpy", "pandas", "orjson", "scikit-learn", "uvicorn", "tabulate", "treelib", "tqdm", "pymoo"]

[project.scripts]
merlin = "merlin.cli:main"
merlin-visualizer = "merlin.visualizer.main:run"
merlin-sparsify = "merlin.run.sparsify:main"
