[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["start_dev.sh", "start_dev.py"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"frontend/build" = "merlin/static"
"docs/_build/html" = "merlin/docs"

[project]
name = "merlin"
version = "0.3.2"
authors = [
  { name="Aaron Langham", email="alangham@mit.edu" },
]
description = "Platform for high- and low-dimensional NILM data visualization"
requires-python = ">=3.9"
dependencies = ["joule", "fastapi", "numpy", "orjson", "scikit-learn", "uvicorn", "tabulate"]

[project.scripts]
merlin = "merlin.cli:main"
merlin-viz = "merlin.main:run"
merlin-process-events = "merlin.event_processor:main"
